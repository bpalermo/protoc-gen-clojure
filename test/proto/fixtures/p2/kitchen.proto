syntax = "proto2";

package fixtures.p2;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option java_multiple_files = true;
option java_package = "com.acme.fixtures.p2";

// proto2 arm of the fixture matrix.
//   field_presence           = EXPLICIT (every field is labelled)
//   enum_type                = CLOSED   -> unknown enum numbers go to unknown fields
//   repeated_field_encoding  = EXPANDED
//   utf8_validation          = NONE
//   json_format              = LEGACY_BEST_EFFORT

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_BLUE = 2;
}

message Nested {
  optional string id = 1;
}

message Kitchen {
  optional string str_field = 1;
  optional int32 int_field = 2;
  optional bool bool_field = 3;
  optional bytes bytes_field = 4;
  optional double dbl_field = 5;
  optional int64 long_field = 6;
  optional Color enum_field = 7;
  optional Nested msg_field = 8;
  repeated string tags = 9;
  repeated Nested children = 10;
  map<string, int32> counts = 11;

  oneof choice {
    string choice_str = 12;
    int32 choice_int = 13;
    Nested choice_msg = 14;
  }

  optional google.protobuf.Timestamp ts = 15;
  optional google.protobuf.Duration dur = 16;
  optional google.protobuf.StringValue wrapped = 17;
}
