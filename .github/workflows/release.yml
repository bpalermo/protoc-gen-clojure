name: release

on:
  push:
    # Matches prerelease tags too: `*` matches any character except `/`, so the
    # final one absorbs the suffix in v0.1.0-rc1. Rehearsal tags therefore trigger
    # this workflow, and the `prerelease` input below marks them accordingly.
    tags: ["v*.*.*"]
  # Manual dispatch for retries. There is deliberately no dry_run any more: the
  # source archive must be produced by bazel-contrib/.github's release_ruleset
  # workflow or BCR rejects its attestation, and that workflow always releases.
  # Rehearse with a prerelease tag instead.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fail before spending four native builds on a version that misreports itself.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the source must agree with the tag
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "releasing $version"

          # Read from the workspace-status script rather than re-parsing
          # plugin.clj here. Two copies of a version parser drift, and the symptom
          # only shows up when cutting a release — which is this job's whole job.
          declared=$(bazel/tools/workspace_status.sh | awk '$1 == "STABLE_VERSION" { print $2 }')
          if [ "$declared" != "$version" ]; then
            echo "::error::plugin.clj declares '$declared' but the tag is '$version'" >&2
            exit 1
          fi

          # MODULE.bazel's version is what BCR publishes.
          modver=$(grep -oE 'version = "[^"]+"' MODULE.bazel | head -1 | cut -d'"' -f2)
          if [ "$modver" != "$version" ]; then
            echo "::error::MODULE.bazel declares '$modver' but the tag is '$version'" >&2
            exit 1
          fi

  # GraalVM cannot cross-compile, so one runner per target platform.
  # https://github.com/oracle/graal/issues/407
  #
  # These run here rather than inside release_ruleset because that workflow is a
  # single runner; release_prep.sh picks the binaries up as artifacts.
  native:
    needs: check
    name: ${{ matrix.os_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_arch: linux_x86_64
          - runner: ubuntu-24.04-arm
            os_arch: linux_aarch64
          # macos-15-intel, not macos-13: that image was retired in December 2025
          # and the label can no longer be assigned, so a job requesting it queues
          # forever instead of failing fast. It is GitHub's last Intel image and
          # goes in Fall 2027, after which darwin_x86_64 needs a cross-build or to
          # be dropped.
          - runner: macos-15-intel
            os_arch: darwin_x86_64
          - runner: macos-latest
            os_arch: darwin_arm64
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: release
          repository-cache: true
          # Only main writes caches; see ci.yml. A tag ref's caches could never be
          # read by anything anyway.
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      - name: build the native binary
        run: bazel build //src/protoc_gen_clojure:protoc_gen_clojure

      # A matrix misconfiguration would otherwise ship four copies of one host
      # build under four different names, and nothing downstream would notice.
      - name: assert the binary is actually for this platform
        run: |
          out=bazel-bin/src/protoc_gen_clojure/protoc-gen-clojure
          file "$out"
          case "${{ matrix.os_arch }}" in
            linux_x86_64)  file "$out" | grep -q "ELF 64-bit.*x86-64" ;;
            linux_aarch64) file "$out" | grep -q "ELF 64-bit.*aarch64" ;;
            darwin_x86_64) file "$out" | grep -q "Mach-O 64-bit.*x86_64" ;;
            darwin_arm64)  file "$out" | grep -q "Mach-O 64-bit.*arm64" ;;
          esac

          # Report and bound the glibc floor of the Linux binaries.
          #
          # They are dynamically linked: GraalVM's --static needs a musl-built
          # libz.a, which neither zlib1g-dev nor a zig toolchain provides (see the
          # tracking issue). A user on an older distribution gets
          # "GLIBC_2.xx not found" from a binary that ran fine in CI.
          #
          # Asserting it makes the floor a deliberate, visible property rather than
          # an accident of the runner image: bumping the runner will fail here
          # instead of silently narrowing who can run the release.
          #
          # The ceiling is 2.34, which is what v0.1.0-rc1 actually produced on both
          # architectures — NOT the runner's own 2.39, because GraalVM links against
          # older symbol versions than the build host provides. It was set to 2.39
          # before anything had been released, which left five versions of slack: the
          # floor could have crept up to 2.39 and silently dropped every distribution
          # between, including the ubuntu2204 image that .bcr/presubmit.yml now
          # relies on. Raising this line is a deliberate act of narrowing support.
          case "${{ matrix.os_arch }}" in
            linux_*)
              floor=$(objdump -T "$out" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
              echo "glibc floor: ${floor:-none}"
              max="GLIBC_2.34"
              if [ -n "$floor" ] && [ "$(printf '%s\n%s\n' "$floor" "$max" | sort -V | tail -1)" != "$max" ]; then
                echo "::error::glibc floor $floor exceeds $max; the runner image moved" >&2
                exit 1
              fi
              ;;
          esac

      - name: it runs, and reports the release version
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          got="$(bazel-bin/src/protoc_gen_clojure/protoc-gen-clojure --version)"
          echo "$got"
          echo "$got" | grep -q "${TAG#v}"

      - name: name it for release
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p out
          cp bazel-bin/src/protoc_gen_clojure/protoc-gen-clojure \
            "out/protoc-gen-clojure_${TAG#v}_${{ matrix.os_arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os_arch }}
          path: out/*
          if-no-files-found: error

  # The artifact under real protoc and real buf, before anything is published.
  distribution:
    needs: [check, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v8 is what release_ruleset itself pins, so both halves of the release now
      # download artifacts with the same implementation. It also errors on a digest
      # mismatch rather than warning, which is the behaviour worth having on the job
      # that validates the binary we are about to publish.
      - uses: actions/download-artifact@v8
        with:
          name: binary-linux_x86_64
          path: dl

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          chmod +x dl/*
          PLUGIN="$PWD/dl/protoc-gen-clojure_${TAG#v}_linux_x86_64" \
            bazel run //test:distribution_check

  # The release itself goes through bazel-contrib's workflow rather than
  # `gh release create`. Not a style preference: BCR verifies that a module's
  # source-archive attestation was signed by bazel-contrib/.github's
  # release_ruleset workflow and rejects attestations produced any other way, so
  # building the archive here and attesting it with actions/attest-build-provenance
  # — which is what this workflow used to do — would not be accepted.
  #
  # draft: true is required for attestations to coexist with immutable releases:
  # assets must be attached while the release is still mutable. The finalize job
  # below flips it to published.
  release:
    needs: [check, native, distribution]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      bazel_test_command: "bazel test //..."
      draft: true
      # Derived from the tag: anything with a -suffix (v0.1.0-rc1) is a
      # prerelease. Hardcoding false would publish a rehearsal tag as a full
      # release, which is the opposite of rehearsing.
      prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
      release_files: |
        protoc-gen-clojure-module.tar.gz
        protoc-gen-clojure_*
      tag_name: ${{ inputs.tag_name || github.ref_name }}

  # Pushed only after BCR publishing succeeds, which is also when the release stops
  # being a draft. Depending on `release` alone was not enough: that job leaves a
  # DRAFT, so a failed BCR push produced a published image for a release nobody
  # could see. Nothing was corrupted — tags are immutable and the builds
  # reproducible — but it contradicted the property the draft/finalise flow exists
  # for, that nothing is announced until the whole pipeline succeeds.
  push-image:
    needs: [check, publish-to-bcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Stamped tags include the commit, so the status script needs real git
          # history rather than a shallow clone's grafted HEAD.
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # rules_img reads credentials from the Docker config; this writes it without
      # needing a Docker daemon for the push itself.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push the plugin image
        run: bazel run //bazel/dev:push

  # Publishing the release is the LAST thing that happens, because it is the only
  # irreversible, publicly visible step. Everything before it can be re-run.
  #
  # It has to live in this workflow rather than alongside the BCR publish: when it
  # did, it ran before push-image, so a failed image push left a public release
  # with no image. A called workflow cannot wait on its caller's sibling jobs.
  finalize:
    needs: [check, publish-to-bcr, push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # Called DIRECTLY, not through a local wrapper workflow, and that is
  # load-bearing rather than tidiness.
  #
  # This used to be `uses: ./.github/workflows/publish-to-bcr.yml`, a thin wrapper
  # that existed to share the input block with a manual-retry entry point. That
  # made the whole `release` workflow fail startup validation — every job,
  # including the four native builds, refused to start — because `publish_token`
  # is a REQUIRED secret of the workflow below and `secrets: inherit` cannot
  # satisfy a required secret one level down: a wrapper's inherited secret set is
  # not statically known, so validation cannot prove the secret is present.
  #
  # Bisected with `if: false` probe workflows, which are validated at startup but
  # never executed:
  #   - publish.yaml called directly, `secrets: inherit`           -> valid
  #   - trivial local wrapper, `secrets: inherit`                  -> valid
  #   - wrapper DECLARING `publish_token` and mapping it onward    -> valid
  #   - wrapper relying on `secrets: inherit` for it               -> STARTUP FAILURE
  #
  # "valid" above means only that the workflow could START. GitHub checks required
  # secrets in TWO places, and `if: false` skips the second: the direct call with
  # `secrets: inherit` passed startup and then still failed at job evaluation. So a
  # green probe here proves the graph loads, not that the job can run.
  #
  # There is deliberately no manual-retry workflow any more. GitHub's "Re-run
  # failed jobs" on this run is the retry, and it does not need a second copy of
  # the configuration below to drift out of step.
  #
  # On the secret, which is subtler than it looks and cost the v0.1.0-rc1 run:
  # `secrets: inherit` does NOT work here, even for this direct call. It fails
  # before any step runs, with
  #
  #   Error when evaluating 'secrets'. Secret publish_token is required, but not
  #   provided while calling.
  #
  # because PUBLISH_TOKEN is an ENVIRONMENT secret and `inherit` passes only the
  # caller's repository and organization secrets. Mapping it explicitly is what
  # works, and it is not the no-op it appears to be. Measured with a probe that
  # printed secret LENGTHS from inside a called workflow whose job declares the
  # environment:
  #
  #   caller maps `${{ secrets.PUBLISH_TOKEN }}` explicitly  -> length 40
  #   caller uses `secrets: inherit`, secret optional        -> length 0
  #   same job reading `secrets.PUBLISH_TOKEN` directly      -> length 40
  #
  # So two separate things happen: the mapping below is empty at THIS level, which
  # is all the static required-secret check needs, and the environment secret then
  # shadows it inside the job that declares `environment:`. Reverting this to
  # `inherit` breaks the release again, at job evaluation rather than at push time.
  publish-to-bcr:
    needs: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      # A fork of bazelbuild/bazel-central-registry that the token can push a
      # branch to; the pull request is opened from there against upstream.
      registry_fork: bpalermo/bazel-central-registry
      # A prerelease pushes the entry branch to the fork but stops short of the
      # upstream pull request. Two reasons, both because that pull request targets
      # a repository this project does not own:
      #
      #   - BCR is add-only. A merged 0.1.0-rc1 entry is permanent, and nobody
      #     wants a release candidate in the registry they resolve deps from.
      #   - Rehearsing the pipeline must not spend BCR reviewers' attention.
      #
      # Upstream's `Push to fork` step carries no `if`, so a rehearsal still
      # exercises token auth, asset download, attestation and entry generation.
      # When this is false a step emits a URL for opening the pull request by
      # hand, which is the escape hatch if a prerelease ever needs publishing.
      open_pull_request: ${{ !contains(inputs.tag_name || github.ref_name, '-') }}
      # The PAT lives in the `bcr-publish` deployment environment, whose policy
      # allows only tags matching v*, so a pull request cannot reach it. The
      # environment is passed as an INPUT because a `uses:` job cannot declare
      # `environment:` itself (actions/runner#1490); the callee's job declares it,
      # which is also the only place the environment secret can be resolved.
      #
      # The environment secret must be named PUBLISH_TOKEN, matching the callee's
      # `secrets.publish_token` (names are case-insensitive) so that it shadows the
      # value mapped below. A differently-named secret would leave the mapping empty
      # and fail at git push time with an opaque auth error instead.
      environment: bcr-publish
      # Required with immutable releases: the release is still a draft while this
      # runs, so downloading assets by release URL would 404. Upstream defaults it
      # to true, but it is load-bearing for the draft/finalise flow, so state it.
      download_default_release_artifacts: true
      # attest defaults to true and stays that way. It is only accepted because
      # the archive comes from release_ruleset — see the comment above.
    # Explicitly mapped, NOT `inherit`. See the comment above this job: this
    # expression is empty here, and the bcr-publish environment secret shadows it
    # inside the callee's job. Do not "simplify" it to inherit.
    secrets:
      publish_token: ${{ secrets.PUBLISH_TOKEN }}
