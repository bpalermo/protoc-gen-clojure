name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GHAS requires an explicit least-privilege grant; the default token permissions
# are otherwise write-heavy for every job in the workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: bazel (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["21", "25"]
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # Pull requests RESTORE caches but never SAVE them, so only code that
          # has been merged — and therefore reviewed — can populate a cache that a
          # later trusted build consumes. Without this, an untrusted PR writes
          # entries under keys a subsequent run may restore, which is the standard
          # Actions cache-poisoning shape.
          #
          # GitHub's ref scoping already stops main from reading a PR's caches (a
          # run sees its own ref, its base, and the default branch — never a
          # sibling branch), so this is defence in depth rather than the only
          # barrier. It also fixes a concrete second problem: PR caches were
          # consuming most of the 10GB repo quota and evicting main's, which are
          # the ones every PR restores from.
          #
          # The cost is that a PR no longer accumulates its own disk cache across
          # pushes. It still restores main's, so runs are warm, just not
          # incremental.
          #
          # Gated on the REF, not the event. `event_name != 'pull_request'` looked
          # equivalent and is not: this workflow also has workflow_dispatch, which
          # can target any branch, so a manual run on a feature branch would still
          # write branch-scoped caches and evict main's from the shared 10GB quota.
          # The rule we actually want is "main writes, everything else reads".
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      - name: lint (buf, shellcheck, formatting)
        run: bazel test //... --test_tag_filters=lint --test_output=errors

      # `bazel test //...` does not build non-test targets, and the image is
      # linux-only (it must contain a Linux binary, and GraalVM cannot
      # cross-compile), so it is skipped as incompatible on a developer's Mac.
      # This is where it actually gets built.
      - name: build the plugin container image
        run: bazel build //bazel/dev:image

      - name: bazel test //...
        run: |
          bazel test //... --test_output=errors \
            --java_runtime_version=remotejdk_${{ matrix.jdk }} \
            --java_language_version=${{ matrix.jdk }}
