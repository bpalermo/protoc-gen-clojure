name: probe-final
on:
  push:
    branches: [fix-nested-publish-startup]
permissions: {contents: read}
jobs:
  publish-to-bcr:
    if: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      # A fork of bazelbuild/bazel-central-registry that the token can push a
      # branch to; the pull request is opened from there against upstream.
      registry_fork: bpalermo/bazel-central-registry
      # A prerelease pushes the entry branch to the fork but stops short of the
      # upstream pull request. Two reasons, both because that pull request targets
      # a repository this project does not own:
      #
      #   - BCR is add-only. A merged 0.1.0-rc1 entry is permanent, and nobody
      #     wants a release candidate in the registry they resolve deps from.
      #   - Rehearsing the pipeline must not spend BCR reviewers' attention.
      #
      # Upstream's `Push to fork` step carries no `if`, so a rehearsal still
      # exercises token auth, asset download, attestation and entry generation.
      # When this is false a step emits a URL for opening the pull request by
      # hand, which is the escape hatch if a prerelease ever needs publishing.
      open_pull_request: ${{ !contains(inputs.tag_name || github.ref_name, '-') }}
      # The PAT lives in the `bcr-publish` deployment environment, whose policy
      # allows only tags matching v*, so a pull request cannot reach it. The
      # environment is passed as an INPUT because a `uses:` job cannot declare
      # `environment:` itself (actions/runner#1490); the callee's job declares it,
      # which is also the only place the environment secret can be resolved.
      #
      # The secret must be named PUBLISH_TOKEN. With `secrets: inherit` GitHub
      # matches by name and the callee reads `secrets.publish_token` (names are
      # case-insensitive). BCR_PUBLISH_TOKEN would not satisfy it.
      environment: bcr-publish
      # Required with immutable releases: the release is still a draft while this
      # runs, so downloading assets by release URL would 404. Upstream defaults it
      # to true, but it is load-bearing for the draft/finalise flow, so state it.
      download_default_release_artifacts: true
      # attest defaults to true and stays that way. It is only accepted because
      # the archive comes from release_ruleset — see the comment above.
    secrets: inherit
