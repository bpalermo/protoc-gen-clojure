name: publish to the Bazel Central Registry

# The GitHub App is gone: it was discontinued after 30 June 2026, and it could
# never have produced attestations anyway — an App has no access to workflow OIDC
# tokens, which is what BCR verifies the archive against. Hence the reusable
# workflow.

on:
  # Called from release.yml.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

  # Retry by hand if the release succeeded but publishing did not.
  #
  # NB this does NOT publish the release. Finalization lives in release.yml, gated
  # on both the BCR publish and the image push, so a manual retry leaves the release
  # a draft until it is published deliberately:
  #   gh release edit vX.Y.Z --draft=false
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string

jobs:
  publish-to-bcr:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ inputs.tag_name }}
      # A fork of bazelbuild/bazel-central-registry that the token can push a
      # branch to; the PR is opened from there against upstream.
      registry_fork: bpalermo/bazel-central-registry
      # A prerelease pushes the entry branch to the fork but stops short of the
      # upstream pull request. Two reasons, both about the fact that the PR is
      # against a repository we do not own:
      #
      #   - BCR is add-only. A merged 0.1.0-rc1 entry is permanent, and nobody
      #     wants a release candidate in the registry they resolve deps from.
      #   - Rehearsing the pipeline must not spend BCR reviewers' attention. Every
      #     step up to the PR is exercised either way — token auth against the
      #     fork, asset download from the draft release, attestation verification,
      #     entry generation — so the rehearsal loses nothing.
      #
      # With this false the upstream action emits a URL for opening the PR by hand,
      # which is the escape hatch if a prerelease ever does need publishing.
      open_pull_request: ${{ !contains(inputs.tag_name, '-') }}
      # The PAT lives in the `bcr-publish` deployment environment, whose policy
      # allows only tags matching v*, so a pull request cannot reach it. The
      # environment must be passed as an INPUT: a `uses:` job cannot declare
      # `environment:` itself (actions/runner#1490), which is why this input exists.
      #
      # The environment secret must be named PUBLISH_TOKEN. With `secrets: inherit`
      # GitHub matches by name, and the upstream job reads `secrets.publish_token`
      # (names are case-insensitive). A secret named BCR_PUBLISH_TOKEN would not
      # satisfy it — that name only works on the repository-secret path, where the
      # caller maps it explicitly, which is impossible here because this caller
      # cannot read an environment secret.
      environment: bcr-publish
      # Required with immutable releases: the release is still a draft while this
      # runs, so downloading assets by release URL would 404. Upstream defaults it
      # to true, but it is load-bearing for the draft/finalise flow, so state it.
      download_default_release_artifacts: true
      # attest defaults to true and stays that way. It is only accepted because
      # the archive comes from release_ruleset — see the comment in release.yml.
    permissions:
      attestations: write
      contents: write
      id-token: write
    # inherit, not an explicit mapping. The token is an environment secret, and
    # this caller job cannot read it — only the callee's job, which declares the
    # environment, can. Passing `publish_token: ${{ secrets.… }}` from here would
    # send an empty string, and the failure would be an opaque git auth error at
    # push time.
    secrets: inherit
