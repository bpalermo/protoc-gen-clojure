name: musl static probe

# An EXPERIMENT for issue #17, not a gate: no artifact anyone consumes, nothing depends
# on it.
#
# Round 1 (runs 31697923747..31699307000) established two facts, recorded on #17:
#
#   - x86_64 CAN be built fully static: musl libz.a in -H:CLibraryPath plus
#     x86_64-linux-musl-gcc on PATH links, produces "not a dynamic executable" with no
#     GLIBC_* symbols, and runs.
#   - aarch64 CANNOT. With aarch64-linux-musl-gcc on PATH on an arm64 runner,
#     native-image still demands 'x86_64-linux-musl-gcc'. GraalVM hardcodes the x64
#     triple, so this is not a packaging problem and no toolchain choice fixes it.
#
# So this round is x86_64 only, and asks the remaining question: what is the cheapest
# way to put that compiler AND a musl zlib on a runner? Two candidates, head to head,
# because they fail differently:
#
#   apt        `musl-tools` is one apt line, but it installs `musl-gcc` — NOT the
#              `x86_64-linux-musl-gcc` name native-image looks for — and ships no musl
#              zlib, so zlib must be compiled here too.
#   graalvm    GraalVM's own prebuilt toolchain, which its guide says includes zlib.
#              One download, correct binary name, no compilation — but it is a
#              third-party binary from gds.oracle.com, so this checks what is in it
#              rather than trusting the guide.
#
# Round 1's approach (toolchains_musl + a Bazel 8 scratch module) is deliberately NOT
# repeated: it works, but toolchains_musl 0.1.27 cannot load under Bazel 9.2, so it
# could never move into this repo's build as-is.
on:
  pull_request:
    paths:
      - .github/workflows/musl_static_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.method }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: [apt, graalvm]
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: build the deploy jar and fetch the SDK
        run: |
          bazel build //src/protoc_gen_clojure:protoc_gen_clojure_jvm_deploy.jar
          # External files only materialise when something needs them, and the jar does
          # not need GraalVM. The whole tree, not just the launcher: it is a symlink
          # into lib/svm/bin and resolves JAVA_HOME relative to itself.
          bazel build @graalvm//:bin-native-image @graalvm//:files

      - name: 'apt: musl-tools, plus a zlib compiled against it'
        if: matrix.method == 'apt'
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          command -v musl-gcc
          # native-image resolves its compiler BY NAME and takes no path argument, so
          # the apt name has to be bridged. A symlink is enough: musl-gcc is itself a
          # wrapper around the system gcc with musl's headers and libs.
          mkdir -p "$HOME/muslbin"
          ln -sf "$(command -v musl-gcc)" "$HOME/muslbin/x86_64-linux-musl-gcc"
          # musl-tools ships no musl-built libz.a, which is the whole subject of #17, so
          # build one. This is GraalVM's own documented recipe.
          # From the GitHub release, not zlib.net: that site moves older releases to
          # fossils/, so the versioned URL 404s and `tar` then chokes on an HTML error
          # page — which is how the first run of this job failed.
          curl -sSLo zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf zlib.tar.gz
          cd zlib-1.3.1
          CC=musl-gcc ./configure --static --prefix="$HOME/muslzlib"
          make -j"$(nproc)" install
          ls -l "$HOME/muslzlib/lib/libz.a"
          echo "MUSL_BIN=$HOME/muslbin" >>"$GITHUB_ENV"
          echo "ZLIB_DIR=$HOME/muslzlib/lib" >>"$GITHUB_ENV"

      - name: "graalvm: the vendor's prebuilt toolchain"
        if: matrix.method == 'graalvm'
        run: |
          set -euxo pipefail
          cd "$HOME"
          curl -sSLO https://gds.oracle.com/download/bfs/archive/musl-toolchain-1.2.5-oracle-00001-linux-amd64.tar.gz
          tar xzf musl-toolchain-1.2.5-oracle-00001-linux-amd64.tar.gz
          # The guide claims this includes zlib but offers no way to check, so check.
          # A missing libz.a here is the difference between one download and the whole
          # of route 1.
          find "$HOME/musl-toolchain" -name 'libz.a' -o -name 'x86_64-linux-musl-gcc' | sort
          test -x "$HOME/musl-toolchain/bin/x86_64-linux-musl-gcc"
          libz="$(find "$HOME/musl-toolchain" -name 'libz.a' | head -1)"
          test -n "$libz" || { echo "::error::no libz.a in the vendor toolchain" >&2; exit 1; }
          echo "MUSL_BIN=$HOME/musl-toolchain/bin" >>"$GITHUB_ENV"
          echo "ZLIB_DIR=$(dirname "$libz")" >>"$GITHUB_ENV"

      - name: build it static
        id: static
        continue-on-error: true
        run: |
          set -uxo pipefail
          export PATH="$MUSL_BIN:$PATH"
          x86_64-linux-musl-gcc --version | head -1
          root="$(bazel info execution_root)"
          ni="$root/$(bazel cquery --output=files @graalvm//:bin-native-image 2>/dev/null | head -1)"
          "$ni" \
            --static \
            --libc=musl \
            --no-fallback \
            --initialize-at-build-time \
            -H:+ReportExceptionStackTraces \
            -H:CLibraryPath="$ZLIB_DIR" \
            -jar bazel-bin/src/protoc_gen_clojure/protoc_gen_clojure_jvm_deploy.jar \
            protoc-gen-clojure-static 2>&1 | tail -25

      # Always: the failure text is the result when it fails.
      - name: what happened
        if: always()
        run: |
          set +e
          echo "=== method: ${{ matrix.method }}, outcome: ${{ steps.static.outcome }}"
          if [ -x ./protoc-gen-clojure-static ]; then
            file ./protoc-gen-clojure-static
            echo "ldd: $(ldd ./protoc-gen-clojure-static 2>&1 | head -2)"
            echo "glibc symbol versions (empty is the goal): $(objdump -T ./protoc-gen-clojure-static 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -u | tr '\n' ' ')"
            echo "size: $(du -h ./protoc-gen-clojure-static | cut -f1)"
            echo "runs: $(./protoc-gen-clojure-static --version)"
          else
            echo "no binary produced"
          fi
