# Metadata for a BSR remote plugin.
#
# NOT yet published, and not publishable unilaterally: public plugin publishing
# on buf.build is not self-serve — it needs a Pro/Enterprise private instance, or
# Buf's acceptance of a request against bufbuild/plugins, which they gate on
# adoption and maturity. This file exists so that request is a formality rather
# than a project.
#
# A remote plugin also needs a container image. It is built by //bazel/dev:image
# with rules_img — no Docker daemon, and the native binary comes straight from the
# build graph — and pushed to ghcr.io on release by //bazel/dev:push. GHCR is not a
# BSR, so this metadata is still unused; the image existing at a stable, stamped
# location is what makes the request above a formality.
#
# The plugin does qualify technically: the BSR sandbox requires a remote plugin
# to be a pure function of the CodeGeneratorRequest — no filesystem, no network,
# no environment — which //test:sandbox_conformance_test enforces.
version: v1
name: buf.build/bpalermo/clojure
plugin_version: v0.1.0-rc1
source_url: https://github.com/bpalermo/protoc-gen-clojure
description: Generates Clojure records, codecs and gRPC service descriptors.
output_languages:
  - clojure
spdx_license_id: Apache-2.0
license_url: https://github.com/bpalermo/protoc-gen-clojure/blob/main/LICENSE
registry:
  opts: []
